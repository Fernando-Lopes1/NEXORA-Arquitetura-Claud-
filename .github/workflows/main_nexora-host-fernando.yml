# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nexora-host-fernando

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build host
        env:
          REMOTE_URL: https://nexora-remote-fernando.azurewebsites.net/remoteEntry.js
        run: |
          cd host
          npm install
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-pkg
          cp -r host/dist deploy-pkg/
          cp host/server.js deploy-pkg/
          cp host/package.json deploy-pkg/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_29389250C50341BD9652463C35B2DB71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53766A616C02450D9CE46998C0D8E6C5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA2892E8205C484BA55D62E61F12F0CC }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nexora-host-fernando'
          slot-name: 'Production'
          package: .