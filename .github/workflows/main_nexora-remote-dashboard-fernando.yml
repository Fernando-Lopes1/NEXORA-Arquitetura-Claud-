# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nexora-remote-dashboard-fernando

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build remote-dashboard
        run: |
          cd remote-dashboard
          npm install
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-pkg
          cp -r remote-dashboard/dist deploy-pkg/
          cp remote-dashboard/server.js deploy-pkg/
          cp remote-dashboard/package.json deploy-pkg/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E49CEB5C197748029985E2193D6B63F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_51CC72A416DF4BC49913368959F8ACDF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DA7479CFDFE049A9AA690348C67E8216 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nexora-remote-dashboard-fernando'
          slot-name: 'Production'
          package: .