# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nexora-host-dashboard-fernando

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build host-dashboard
        env:
          REMOTE_DASHBOARD_URL: https://nexora-remote-dashboard-fernando.azurewebsites.net/remoteEntry.js
        run: |
          cd host-dashboard
          npm install
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-pkg
          cp -r host-dashboard/dist deploy-pkg/
          cp host-dashboard/server.js deploy-pkg/
          cp host-dashboard/package.json deploy-pkg/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7B0E2460DFD347CABECE022855E2CB55 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B6E7301DC00546B6AF65B52EB67E2358 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D2F8E6F63DCB4445B8844FD2C5E200B4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nexora-host-dashboard-fernando'
          slot-name: 'Production'
          package: .